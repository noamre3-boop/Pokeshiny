name: Build Shiny Guard APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Shiny Guard
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Check project files
        shell: bash
        run: |
          set -euo pipefail

          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Configure Android SDK
        shell: bash
        run: |
          set -euo pipefail

          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"

          if [ ! -d "$SDK" ]; then
            echo "::error::Android SDK directory not found"
            exit 1
          fi

          MANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -f "$MANAGER" ]; then
            MANAGER="$(find "$SDK/cmdline-tools" \
              -type f -name sdkmanager | sort | tail -n 1)"
          fi

          if [ -z "$MANAGER" ] || [ ! -f "$MANAGER" ]; then
            echo "::error::sdkmanager not found"
            exit 1
          fi

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

          printf 'sdk.dir=%s\n' "$SDK" > local.properties

          python3 - "$MANAGER" "$SDK" <<'PY'
          import subprocess
          import sys

          manager, sdk = sys.argv[1:]

          result = subprocess.run(
              [
                  manager,
                  "--sdk_root=" + sdk,
                  "--licenses",
              ],
              input="y\n" * 200,
              text=True,
          )

          raise SystemExit(result.returncode)
          PY

          "$MANAGER" --sdk_root="$SDK" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail

          gradle assembleDebug \
            --no-daemon \
            --stacktrace \
            --console=plain

      - name: Prepare APK download
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p output

          cp app/build/outputs/apk/debug/app-debug.apk \
            output/ShinyGuard.apk

          test -s output/ShinyGuard.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ShinyGuard-APK
          path: output/ShinyGuard.apk
          if-no-files-found: error
          retention-days: 14
          
